name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: YOUR-ORG/platform-cicd/.github/workflows/dotnet-ci.yml@v1.0.0
    with:
      dotnet-version: "10.0.x"
      solution: src/Starter.sln
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: YOUR-ORG/platform-cicd/.github/workflows/dependency-review.yml@v1.0.0
