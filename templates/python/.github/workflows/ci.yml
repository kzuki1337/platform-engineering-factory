name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: YOUR-ORG/platform-cicd/.github/workflows/python-ci.yml@v1.0.0
    with:
      python-version: "3.12"
      working-directory: .
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: YOUR-ORG/platform-cicd/.github/workflows/dependency-review.yml@v1.0.0
