name: Framework validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      python-version: "3.12"
      working-directory: templates/python

  node:
    uses: ./.github/workflows/node-ci.yml
    with:
      node-version: "22"
      working-directory: templates/node

  dotnet:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      dotnet-version: "10.0.x"
      solution: templates/dotnet/src/Starter.sln

  terraform:
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - terraform/modules/github-oidc-role
          - terraform/modules/ecr-repository
          - terraform/examples/eks-foundation
    uses: ./.github/workflows/terraform-validate.yml
    with:
      terraform-version: "1.9.8"
      working-directory: ${{ matrix.working-directory }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "3.16.3"
      - name: Lint application chart
        run: helm lint helm/application

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml
