name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: "3.12"
      working-directory:
        description: Directory containing pyproject.toml
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --strict-markers --strict-config
